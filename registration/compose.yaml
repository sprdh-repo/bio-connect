services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bioconnect
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: bioconnect
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://bioconnect:local-development-only@db:5432/bioconnect?sslmode=disable
      STORAGE_DIR: /data/files
      APP_ENV: development
      LIVE_DELIVERY: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
volumes:
  db:
  files:
