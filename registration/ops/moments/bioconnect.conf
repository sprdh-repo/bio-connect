# Bio Connect registration origin, rendered by registration/ops/moments/deploy.sh.
# Included from httpd-includes.conf after the Moments vhosts, so it never becomes
# the default site for 185.62.36.59. CloudFront EEDV34VX46GG7 is the only client:
# requests must come from a CloudFront origin-facing range AND carry the shared
# secret header.
<VirtualHost 185.62.36.59:80>
    ServerName @ORIGIN_HOSTNAME@
    CustomLog /dev/null common
    Alias /.well-known/acme-challenge/ /var/www/bioconnect-acme/.well-known/acme-challenge/
    <Directory /var/www/bioconnect-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ - [F]
</VirtualHost>
@TLS_BEGIN@
<VirtualHost 185.62.36.59:443>
    ServerName @ORIGIN_HOSTNAME@
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/@ORIGIN_HOSTNAME@/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/@ORIGIN_HOSTNAME@/privkey.pem
    # Do not log request paths: /passes/<token> and recovery links carry secrets.
    CustomLog /dev/null common
    ErrorLog /var/log/httpd/bioconnect-error.log
    <Location />
        <RequireAll>
            Include /etc/httpd/conf/extra/bioconnect-cloudfront-ips.conf
            Require expr "%{HTTP:X-Origin-Verify} == '@EDGE_AUTH_SECRET@'"
        </RequireAll>
    </Location>
    RequestHeader unset X-Origin-Verify
    RequestHeader set X-BioConnect-Client-IP "expr=%{req:X-Forwarded-For}"
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8090/ timeout=120
    ProxyPassReverse / http://127.0.0.1:8090/
</VirtualHost>
@TLS_END@
